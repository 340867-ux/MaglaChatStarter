<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAGLA Chat Starter — настройки</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="card">
    <h1>MAGLA Chat Starter</h1>
    <p class="lead">Один шаблон для первого сообщения в новом чате.</p>
    <label>Короткая фраза
      <input id="phrase" maxlength="500" placeholder="Например: Начинаем работу.">
    </label>
    <label>Список плагинов и инструментов
      <textarea id="plugins" rows="7" placeholder="Вставь сюда свой список. Можно оставить пустым."></textarea>
    </label>
    <label>Шаблон сообщения
      <textarea id="template" rows="8"></textarea>
    </label>
    <p class="hint">Доступные вставки: <code>{{phrase}}</code> и <code>{{plugins}}</code>.</p>
    <div class="actions">
      <button id="save" class="primary">Сохранить</button>
      <button id="reset" class="secondary">Сбросить</button>
    </div>
    <p id="status" class="status" role="status"></p>
    <section>
      <h2>Предпросмотр</h2>
      <pre id="preview"></pre>
    </section>
    <p class="privacy">Расширение хранит только настройки в локальном хранилище браузера. Не читает и не отправляет историю чатов.</p>
  </main>
  <script src="core.js"></script>
  <script src="storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
